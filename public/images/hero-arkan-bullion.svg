<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="t d">
  <title id="t">شمش آرکان گلد، طلای آب‌شده و صندوق ایمن</title>
  <desc id="d">شمش‌های ۷۵۰ عیار آرکان گلد جلوی درب صندوق ایمن، و طلای مذابی که در قالب ریخته می‌شود.</desc>
  <defs>
    <!-- طلای شمش -->
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58c"/>
      <stop offset="0.45" stop-color="#d4a94f"/>
      <stop offset="1" stop-color="#9c7127"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbe9b7"/>
      <stop offset="0.5" stop-color="#fff7de"/>
      <stop offset="1" stop-color="#e9c979"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98a35"/>
      <stop offset="1" stop-color="#7d5a1d"/>
    </linearGradient>
    <!-- درب صندوق -->
    <radialGradient id="doorFace" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6a111a"/>
      <stop offset="0.55" stop-color="#3d070c"/>
      <stop offset="1" stop-color="#1a0204"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d48f"/>
      <stop offset="0.5" stop-color="#b8893a"/>
      <stop offset="1" stop-color="#6e4f18"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff2c9"/>
      <stop offset="0.5" stop-color="#d0a24a"/>
      <stop offset="1" stop-color="#7a561b"/>
    </radialGradient>
    <!-- طلای مذاب -->
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.4" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#e08a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="backGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#330509" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#330509" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crucible" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a0d13"/>
      <stop offset="1" stop-color="#1a0204"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0d13"/>
      <stop offset="1" stop-color="#260306"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- یک شمش (نمای روبه‌رو با کمی دید از بالا) -->
    <g id="bar">
      <polygon points="24,0 146,0 160,20 10,20" fill="url(#goldTop)"/>
      <polygon points="10,20 160,20 170,62 0,62" fill="url(#goldFront)"/>
      <polygon points="146,0 160,20 170,62 164,62 150,20" fill="url(#goldSide)" opacity="0.55"/>
      <polygon points="10,20 160,20 170,62 0,62" fill="none" stroke="#8a6424" stroke-width="1"/>
      <polygon points="24,0 146,0 160,20 10,20" fill="none" stroke="#c89b45" stroke-width="0.8"/>
      <path d="M16 26 L60 26 L24 56 L6 56 Z" fill="#ffffff" opacity="0.18"/>
    </g>
  </defs>

  <!-- هاله پس‌زمینه -->
  <ellipse cx="280" cy="230" rx="260" ry="220" fill="url(#backGlow)"/>

  <!-- ===== درب صندوق ایمن ===== -->
  <g>
    <!-- لولا -->
    <rect x="96" y="120" width="26" height="46" rx="6" fill="url(#ring)"/>
    <rect x="96" y="250" width="26" height="46" rx="6" fill="url(#ring)"/>
    <circle cx="270" cy="208" r="168" fill="url(#ring)"/>
    <circle cx="270" cy="208" r="156" fill="#260306"/>
    <circle cx="270" cy="208" r="148" fill="url(#doorFace)"/>
    <circle cx="270" cy="208" r="148" fill="none" stroke="#c5a059" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="270" cy="208" r="118" fill="none" stroke="#c5a059" stroke-opacity="0.22" stroke-width="10"/>
    <!-- پیچ‌های دور درب -->
    <g fill="url(#hub)">
      <circle cx="270" cy="68" r="7"/><circle cx="340" cy="87" r="7"/><circle cx="391" cy="138" r="7"/>
      <circle cx="410" cy="208" r="7"/><circle cx="391" cy="278" r="7"/>
      <circle cx="200" cy="87" r="7"/><circle cx="149" cy="138" r="7"/>
      <circle cx="130" cy="208" r="7"/><circle cx="149" cy="278" r="7"/>
    </g>
    <!-- فرمان سه‌پره -->
    <g stroke="#c49545" stroke-width="10" stroke-linecap="round">
      <line x1="270" y1="208" x2="270" y2="130"/>
      <line x1="270" y1="208" x2="338" y2="247"/>
      <line x1="270" y1="208" x2="202" y2="247"/>
    </g>
    <g fill="url(#hub)">
      <circle cx="270" cy="128" r="11"/><circle cx="340" cy="248" r="11"/><circle cx="200" cy="248" r="11"/>
    </g>
    <circle cx="270" cy="208" r="36" fill="url(#hub)"/>
    <circle cx="270" cy="208" r="26" fill="#3d070c"/>
    <g stroke="#e9cf8f" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="270" y1="186" x2="270" y2="192"/><line x1="292" y1="208" x2="286" y2="208"/>
      <line x1="270" y1="230" x2="270" y2="224"/><line x1="248" y1="208" x2="254" y2="208"/>
    </g>
    <circle cx="270" cy="208" r="7" fill="url(#hub)"/>
    <text x="270" y="108" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#e9cf8f" opacity="0.85">ARKAN VAULT</text>
  </g>

  <!-- ===== نشان امنیت ===== -->
  <g transform="translate(58 58)">
    <circle cx="34" cy="38" r="44" fill="url(#glow)" opacity="0.35"/>
    <path d="M34 4 L64 16 V38 C64 58 51 72 34 78 C17 72 4 58 4 38 V16 Z" fill="url(#shield)" stroke="url(#ring)" stroke-width="3"/>
    <path d="M20 40 L30 50 L49 29" fill="none" stroke="#f1d48f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== طلای مذاب: بوته و جریان ===== -->
  <g>
    <ellipse cx="478" cy="336" rx="70" ry="30" fill="url(#glow)"/>
    <!-- بوته ذوب -->
    <g transform="rotate(-40 471 90)">
      <path d="M430 52 H512 L502 110 C500 120 492 126 482 126 H460 C450 126 442 120 440 110 Z" fill="url(#crucible)" stroke="url(#ring)" stroke-width="3"/>
      <ellipse cx="471" cy="52" rx="41" ry="9" fill="url(#molten)"/>
      <rect x="506" y="62" width="44" height="9" rx="4" fill="url(#ring)"/>
    </g>
    <!-- جریان طلای مذاب -->
    <path d="M417 92 C410 160 468 220 472 300" fill="none" stroke="url(#molten)" stroke-width="9" stroke-linecap="round"/>
    <path d="M417 92 C410 160 468 220 472 300" fill="none" stroke="#fff7d6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- قالب شمش با طلای مذاب -->
    <polygon points="418,318 530,318 540,346 408,346" fill="#2a0407"/>
    <polygon points="408,346 540,346 540,362 408,362" fill="#1a0204"/>
    <polygon points="426,322 522,322 530,342 418,342" fill="url(#molten)"/>
    <ellipse cx="472" cy="326" rx="18" ry="4" fill="#fff7d6" opacity="0.9"/>
    <!-- قطره‌ها و جرقه‌ها -->
    <circle cx="492" cy="304" r="3" fill="#ffd66b"/>
    <circle cx="455" cy="298" r="2.2" fill="#ffd66b"/>
    <circle cx="500" cy="290" r="1.6" fill="#ffe9a6"/>
  </g>

  <!-- ===== دسته شمش‌های آرکان ===== -->
  <ellipse cx="236" cy="428" rx="200" ry="18" fill="#330509" opacity="0.18" filter="url(#soft)"/>
  <use href="#bar" x="58" y="352"/>
  <use href="#bar" x="228" y="352"/>
  <use href="#bar" x="143" y="310"/>

  <!-- حکاکی روی شمش بالایی -->
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle" fill="#6b4a14">
    <text x="228" y="346" font-size="13" font-weight="700" letter-spacing="3">ARKAN GOLD</text>
    <text x="228" y="364" font-size="11" font-weight="700" letter-spacing="2">750 • FINE GOLD</text>
  </g>
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle" fill="#6b4a14" opacity="0.85">
    <text x="143" y="398" font-size="11" font-weight="700" letter-spacing="2">750</text>
    <text x="313" y="398" font-size="11" font-weight="700" letter-spacing="2">750</text>
  </g>

  <!-- درخشش -->
  <g fill="#ffffff">
    <path d="M178 316 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z" opacity="0.95"/>
    <path d="M372 372 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" opacity="0.9"/>
    <path d="M430 150 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#ffe7a3"/>
  </g>
</svg>
