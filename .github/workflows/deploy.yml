# انتشار کد سایت روی هاست (FTP) — فقط برای تغییر کد/طراحی لازم است، نه برای انتشار مطلب
# ----------------------------------------------------
# مطالب مجله روی سرور Node.js هنگام بازدید از وردپرس ساخته می‌شوند و به build نیاز ندارند.
# اجرا: تب Actions ← Deploy ← Run workflow
#
# تنظیمات GitHub (Settings ← Secrets and variables ← Actions) — راهنما: README ← «مجله»
#   Secrets:   FTP_SERVER، FTP_USERNAME، FTP_PASSWORD
#   Variables: PUBLIC_WP_API_URL (مثلا https://cms.arkan.gold/wp-json)
#              FTP_SERVER_DIR  پوشه‌ی سایت نسبت به ریشه‌ی FTP (پیش‌فرض public_html)
#              FTP_APP_DIR     پوشه‌ی برنامه‌ی Node.js مجله نسبت به ریشه‌ی FTP (پیش‌فرض arkan-mag)
#              FTP_VERIFY_CERT اگر گواهی FTPS هاست با نام سرور نمی‌خواند: false
#              و در صورت نیاز PUBLIC_GA4_ID، PUBLIC_YEKTANET_ID، PUBLIC_ENAMAD_ID، PUBLIC_ENAMAD_CODE
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_WP_API_URL: ${{ vars.PUBLIC_WP_API_URL }}
      PUBLIC_ARKAN_API_URL: ${{ vars.PUBLIC_ARKAN_API_URL }}
      PUBLIC_VERIFY_API_URL: ${{ vars.PUBLIC_VERIFY_API_URL }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      PUBLIC_YEKTANET_ID: ${{ vars.PUBLIC_YEKTANET_ID }}
      PUBLIC_ENAMAD_ID: ${{ vars.PUBLIC_ENAMAD_ID }}
      PUBLIC_ENAMAD_CODE: ${{ vars.PUBLIC_ENAMAD_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ترتیب مهم است: اول فایل‌های ایستا (بدون حذف فایل‌های قدیمی _astro تا صفحه‌های مجله‌ی در حال
      # اجرا خراب نشوند)، بعد برنامه‌ی Node.js که با tmp/restart.txt دوباره راه‌اندازی می‌شود.
      - name: Upload to host (FTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html' }}
          FTP_APP_DIR: ${{ vars.FTP_APP_DIR || 'arkan-mag' }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'true' }}
        run: |
          STATIC_DIR=dist
          APP_CMD=""
          if [ -d dist/mag-app ]; then
            STATIC_DIR=dist/client
            APP_CMD="mirror -R --parallel=4 dist/mag-app $FTP_APP_DIR;"
          fi
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow true; set ssl:verify-certificate $FTP_VERIFY_CERT; set net:max-retries 3; set net:timeout 30;
            mirror -R --parallel=4 $STATIC_DIR $FTP_SERVER_DIR;
            $APP_CMD
            bye"
